name: refresh-pricing-snapshot

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 接口不可达或返回 0 条时脚本非 0 退出，job 在此停住：
      # 宁可不提交，也不把旧快照当今日读数推上线。
      - name: Replay /v1/models and regenerate snapshot
        run: node refresh-model-table.mjs

      # 静态快照必须被机器刷新：手抄的 fallback 就是下一个会过期的数字。
      - name: Embed the cross-repo readings as no-JS snapshot
        run: |
          curl -s --max-time 40 -o gateway-readings.json \
            https://raw.githubusercontent.com/happy520ai/gateway-price-check/main/results/latest.json
          node -e '
            const d=JSON.parse(require("fs").readFileSync("gateway-readings.json","utf8"));
            if(!d.results || d.results.length < 10) { console.error("REFUSED: 拉到的读数不足 10 行，不覆盖快照"); process.exit(1); }
            console.log("fetched", d.results.length, "rows, as_of", d.as_of);
          '
          node embed-readings.mjs gateway-readings.json

      # 分享卡必须跟着数据一起重跑。这两个脚本以前写死 C:/Windows/Fonts，
      # 所以"每日重生成"其实是"从未重生成"：图会停在写它那天的数字，而图片里的数字
      # grep 读不到、CI 看不见，正是最不容易被发现的那种腐烂。
      - name: Regenerate share cards from today's readings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core
          python3 -m pip install --quiet pillow
          python3 make-og-image.py
          python3 make-audit-og.py

      - name: Commit snapshot if it moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data-snapshot.md audit.html gateway-readings.json og-image.png audit-og.png)" ]]; then
            git add data-snapshot.md audit.html gateway-readings.json og-image.png audit-og.png
            git commit -m "data: refresh snapshot and no-JS readings"
            git push
          else
            echo "unchanged"
          fi

      # 页面正文里的价格是人工挑的主力行。清单一旦漂移，这一步变红。
      # pipefail 是必需的：`node x | tee log` 默认返回 tee 的 0，
      # 会把 node 的失败洗掉——真机测过一次，毒化的读数全绿通过、issue 被 skip。
      # 2>&1 同样必需：check-site.mjs 的 FAIL 段走 console.error(stderr)，
      # 只接 stdout 会开出一张"原因空白"的 issue——也真机测过一次。
      - name: Verify page figures still match live endpoint
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          node check-site.mjs 2>&1 | tee check.log

      # 红了要自己找人，不然"有告警"等于"没告警"。
      # 已有开着的同类 issue 就不重复开（避免每天刷一条）。
      - name: Open a drift issue when the published figures go stale
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "线上页面数字已与实时接口漂移，需重写"
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title $TITLE" --json number --jq '. | length')
          if [ "$existing" != "0" ]; then
            echo "已有开着的漂移 issue，跳过重复创建"
            exit 0
          fi
          {
            echo "### check-site.mjs 输出"
            echo '```'
            cat check.log
            echo '```'
            echo
            echo "实时接口读数已变化，但 \`index.html\` 里挑出来展示的主力价格行还是旧的。"
            echo "请按 \`data-snapshot.md\` 的最新返回值重写正文，或确认这些行确实该下线。"
          } > drift.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file drift.md

      # 额度文案锁着是对的，但锁一辈子是错的：新活动上线时没人会记得解锁。
      # 这一步把"能不能提 50/99 元"变成每天从官方接口读出来的判断。
      - name: Read campaign state from the vendor's own endpoints
        id: campaign
        continue-on-error: true
        run: node check-campaign.mjs

      - name: Commit campaign status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain campaign-status.json)" ]]; then
            git add campaign-status.json
            git commit -m "data: refresh campaign state"
            git push
          else
            echo "campaign status unchanged"
          fi

      # open  => 额度文案可以解锁了，得人来看（改文案是判断，不自动做）
      # unknown => 判不了，也得人来定，别让页面悄悄挂着可能过期的承诺
      # closed => 保持现状，不开 issue
      - name: Open an issue when credit copy can be unlocked or is undecidable
        if: steps.campaign.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("campaign-status.json","utf8")).state)')
          if [ "$STATE" = "closed" ]; then echo "已确认收官，保持锁定，不开 issue"; exit 0; fi
          TITLE="额度文案状态变更：$STATE（请复核 02 与站点 CTA）"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title 额度文案状态变更" --json number --jq '. | length')
          if [ "$existing" != "0" ]; then echo "已有同类 issue，跳过重复"; exit 0; fi
          {
            echo "### 接口读数"
            echo '```'
            cat campaign-status.json
            echo '```'
            echo
            if [ "$STATE" = "open" ]; then
              echo "官方出现**在期的邀请类活动**。若确认额度权益恢复，可解锁 \`02-分平台文案包.md\` 与站点 CTA 里的 50/99 元表述，并同步撤下收官横幅。"
            else
              echo "判据**读不出结论**（接口形状变化或读取失败）。此时既不该上线额度、也不该断言它已结束——请人工确认，并考虑补 \`campaign-status.mjs\` 的解析分支。"
            fi
          } > credit.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file credit.md

      # 漂移时不 ping，避免把过期读数推给检索端。
      - name: Ping IndexNow when figures verified fresh
        if: steps.verify.outcome == 'success'
        env:
          INDEXNOW_URLS: >-
            https://happy520ai.github.io/opencsg-model-pricing/
            https://happy520ai.github.io/opencsg-model-pricing/cost-calculator.html
            https://happy520ai.github.io/opencsg-model-pricing/audit.html
            https://happy520ai.github.io/opencsg-model-pricing/llms.txt
        run: |
          set -euo pipefail
          KEY=$(ls | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | cut -d. -f1)
          if [ -z "$KEY" ]; then echo "REFUSED: 找不到 IndexNow key 文件"; exit 1; fi
          LIST=$(for u in $INDEXNOW_URLS; do printf '"%s",' "$u"; done | sed 's/,$//')
          printf '{"host":"happy520ai.github.io","key":"%s","urlList":[%s]}' "$KEY" "$LIST" > ping.json
          code=$(curl -s -o ping-resp.txt -w '%{http_code}' --max-time 30 \
            -X POST -H "Content-Type: application/json; charset=utf-8" \
            --data @ping.json https://api.indexnow.org/indexnow)
          echo "indexnow http=$code"
          # 202/200 受理；其余算失败，别把"没送到"读成"已提交"
          case "$code" in 200|202) exit 0;; *) cat ping-resp.txt; exit 1;; esac
