name: refresh-pricing-snapshot

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 接口不可达或返回 0 条时脚本非 0 退出，job 在此停住：
      # 宁可不提交，也不把旧快照当今日读数推上线。
      - name: Replay /v1/models and regenerate snapshot
        run: node refresh-model-table.mjs

      - name: Commit snapshot if it moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data-snapshot.md)" ]]; then
            git add data-snapshot.md
            git commit -m "data: refresh model snapshot from live endpoint"
            git push
          else
            echo "snapshot unchanged"
          fi

      # 页面正文里的价格是人工挑的主力行。清单一旦漂移，这一步变红。
      # pipefail 是必需的：`node x | tee log` 默认返回 tee 的 0，
      # 会把 node 的失败洗掉——真机测过一次，毒化的读数全绿通过、issue 被 skip。
      # 2>&1 同样必需：check-site.mjs 的 FAIL 段走 console.error(stderr)，
      # 只接 stdout 会开出一张"原因空白"的 issue——也真机测过一次。
      - name: Verify page figures still match live endpoint
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          node check-site.mjs 2>&1 | tee check.log

      # 红了要自己找人，不然"有告警"等于"没告警"。
      # 已有开着的同类 issue 就不重复开（避免每天刷一条）。
      - name: Open a drift issue when the published figures go stale
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "线上页面数字已与实时接口漂移，需重写"
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title $TITLE" --json number --jq '. | length')
          if [ "$existing" != "0" ]; then
            echo "已有开着的漂移 issue，跳过重复创建"
            exit 0
          fi
          {
            echo "### check-site.mjs 输出"
            echo '```'
            cat check.log
            echo '```'
            echo
            echo "实时接口读数已变化，但 \`index.html\` 里挑出来展示的主力价格行还是旧的。"
            echo "请按 \`data-snapshot.md\` 的最新返回值重写正文，或确认这些行确实该下线。"
          } > drift.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file drift.md
